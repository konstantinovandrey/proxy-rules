# Hermes Proxy Rules — Clash.Meta / Mihomo / Hiddify
# Server: Trojan @ 5.187.0.143:444
# Auto-updating rules every 24h from GitHub Pages

port: 7890
socks-port: 7891
mixed-port: 7893
allow-lan: true
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  fallback:
    - https://dns.google/dns-query
    - https://1.1.1.1/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

proxies:
  - name: "Hermes-Trojan"
    type: trojan
    server: 5.187.0.143
    port: 444
    password: "RE7do6AxvNXq2P7MiYxoYA"
    udp: true

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - Hermes-Trojan
      - DIRECT

  - name: AUTO
    type: url-test
    proxies:
      - Hermes-Trojan
    url: "http://www.gstatic.com/generate_204"
    interval: 300

rule-providers:
  direct:
    type: http
    behavior: classical
    url: "https://konstantinovandrey.github.io/proxy-rules/clash/direct.yaml"
    interval: 86400
    path: ./rules/direct.yaml

  proxy:
    type: http
    behavior: classical
    url: "https://konstantinovandrey.github.io/proxy-rules/clash/proxy.yaml"
    interval: 86400
    path: ./rules/proxy.yaml

  reject:
    type: http
    behavior: classical
    url: "https://konstantinovandrey.github.io/proxy-rules/clash/reject.yaml"
    interval: 86400
    path: ./rules/reject.yaml

rules:
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,localhost,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - RULE-SET,reject,REJECT
  - RULE-SET,direct,DIRECT
  - RULE-SET,proxy,PROXY
  - MATCH,PROXY
